# 地球区域参照图集的区域清单（docs/review_protocol.md §2.2、docs/archetype_library.md §9）
#
# 每个区域：以 center 为中心、size_km 见方的局部等面积方位投影（LAEA）裁剪。
# 出两种分辨率：与世界格网相同（2048x1024，约 19.5 km）用于并排对照；ETOPO 60 角秒（约 1.9 km）展示真实细节。
# review_role：评审时作为哪类世界区域图的对照（review_protocol §2.2 的 8 类）。
# archetypes：该区域可作为哪些原型的地球例子（原型库第 1–6 节中 A、B 级；C 级小于格网，不配图）。

default_size_km: 2000

