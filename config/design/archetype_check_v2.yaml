# 原型库 × 终图 v2 核对表（PROGRESS U22；用户 2026-10-23 要求"先做原型库和终图的核对表，缺的按成因补进终图 v2"）
#
# 逐条核对 docs/archetype_library.md 的全部原型：终图有没有给它留出成因条件、在哪里。
# 校验与生成文档：scripts/run.ps1 python scripts/design_archetype_check.py --design v2
#   （每个原型必须出现且只出现一次；features 里的编号必须是终图里的要素；输出 docs/design_archetype_check_v2.md）
# 图：scripts/design_final_map.py --design v2 的 06 图（编号 = 本文件中的顺序）
#
# features：终图里提供条件的要素编号（config/design/final_map_v2.yaml）；at：没有对应要素时的候选位置 [经, 纬]
# stage：形态在哪个阶段确认（1 构造 / 1.2e 岩性 / 2 地形与水系 / 3 气候、冰川与海洋 / 4 筛选与局部编辑）

version: 2
design: v2
statuses:
  placed: 终图已安排
  added: v2 新增
  candidate: 候选地点
  independent: 不依赖终图

