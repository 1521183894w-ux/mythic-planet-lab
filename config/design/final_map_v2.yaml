# 终图 v2（PROGRESS U22，CLAUDE.md §4）
#
# v2 相对 v1（2026-10-23）：对照原型库逐条核对后补进终图尺度的"奇景舞台"（核对表 config/design/archetype_check_v2.yaml，
# 文档 docs/design_archetype_check_v2.md）：两个"神怒"共振海湾、洲 C/D 之间的走滑断层与死海式洼地（同时改正 v1 南裂谷海
# 运动方式的错误）、岩性区（碳酸盐台地、砂岩台地、红层盆地、蒸发岩、古陆核、花岗岩基、蛇绿岩）、两个撞击构造、
# 远方大陆南端（峡湾与山地冰原）。洲 A 扩大做成选项 bigA（--options bigA），等用户选。
#
# 开发者按用户构想画的世界终图：只含几百公里以上的要素。用户看图提修改意见，改这个文件、重新出图。
# 坐标一律 [经度, 纬度]（度），经度 -180..180。多边形不跨 180° 经线；折线可以跨（按大圆加密）。
# 每个要素写明计划成因（倒推成因的起点；倒推时再细化时间与过程）。
#
# method_class：海陆与要素 user_override（设计，不是模拟结果）。出图与核对：scripts/design_final_map.py
#
# 形状的做法：
# - masses：各大陆的粗轮廓（多边形）；
# - peninsulas / gulfs / 岛屿 spine：沿一条弯曲的中轴线、宽度从根部到尖端渐变的形状（意大利、朝鲜、堪察加都是这种），
#   宽度沿轴有两档缓慢起伏（波长几百公里，幅度约 10%），避免完全光滑；
# - 叠加顺序：masses 与 peninsulas 并集 -> 挖掉 gulfs、seas、straits -> 加上 islands。
# 几百公里以下的海岸细节（峡湾、溺谷、小岛）不在这里画，由之后的模拟产生。

version: 2
name: v2
map_central_longitude: 30
target_ocean_fraction: 0.71
