# 岩性区（v2 新增）：终图尺度的岩性设计，决定喀斯特、平顶山、丹霞、盐丘、花岗岩峰丛等奇景出现在哪里。
# 不改海陆与示意高程（对应的高原、盆地另在 plateaus / basins 里画），只在 06 图上画出；阶段 1.2e 岩性要按它生成，
# 倒推时核对沉积时的古纬度与环境（例如碳酸盐台地要在低纬浅海形成）。
lithology:
