# 终图 v2 的倒推历史（PROGRESS U22；用户 2026-10-24 定稿终图 v2 后开始）
#
# 只倒推运动，不倒推地壳过程（CLAUDE.md §4）：把终图上的陆地按缝合带、裂谷与岛屿成因切成刚体块，
# 为每块在关键时刻给出相对父板块的位置（packages/tectonics/reverse.py 的位姿操作），关键时刻之间球面插值。
# 岛弧、热点岛、零星孤岛、蛇绿岩岛等是 300 Ma 之后新生的地壳，不参与倒推，正向演化时由过程产生。
# 倒推出的是许多可能历史中的一种，不是唯一历史。
#
# 运行：scripts/run.ps1 python -u scripts/design_history.py --design v2 --history v2
# 位置都写在父板块的现今参照系里；move: [km, 方位角°]（0 北 90 东），spin: °（逆时针），pole: [经, 纬, °]。
# method_class：procedural_constrained（运动由设计设定，速度按地球范围检查）。

version: 1
design: v2
t0: 300

# 刚体块。划分顺序即判定顺序：先按岛屿编号，再按标签 + 多边形；没划进任何块的陆地算新生地壳。
# parent 为父板块代号（0 = 绝对参照系）。
blocks:
  - {code: MD, id: 701, name: 裂离微大陆, parent: D, color: "#8e44ad", islands: [I2]}
  - {code: ZL, id: 801, name: 南洋陆块, parent: POL, color: "#16a085", islands: [I6, I7, I24]}
  - {code: IN, id: 702, name: 南方地盾陆块（印度式）, parent: 0, color: "#e67e22", labels: [B], islands: [I21],
     follow: {frame: D, from: 120},
     # 东方大高原南缘缝合带（M3）以南、构造结（M3b）以西
     poly: [[60, 2], [62.5, 24], [63.2, 30.4], [66, 29.6], [74, 28.8], [82, 28.6], [90, 29.2], [97, 30.2], [99.2, 29.2],
            [99.6, 22], [96, 10], [86, 0]]}
  - {code: BSE, id: 102, name: 东南增生地块, parent: B, color: "#27ae60", labels: [B], islands: [I8, I16, I17],
     follow: {frame: POL, from: 280},
     # 东南增生半岛根部的窄缝合带（约 21.5°N）以南
     poly: [[99.4, 21.6], [106, 21.6], [111, 20.6], [122, 10], [122, -12], [92, -12], [92, 8]]}
  - {code: A, id: 103, name: 洲 A, parent: B, color: "#c0392b", labels: [A, B], islands: [I1, I1b, I4],
     # 洲 A、B 之间的老缝合带（中部长海 G2）以西，经神怒湾湾顶接到内海
     poly: [[-50, 34], [-50, 82], [6, 82], [4.5, 64], [6, 59.5], [10, 55.5], [14, 51.6], [15.6, 49.2], [16.2, 44.6],
            [18.8, 41.4], [17.4, 38.0], [17.4, 34]]}
  - {code: B, id: 101, name: 洲 B（北方地台与东方地块）, parent: 0, color: "#2e86c1", labels: [A, B],
     islands: [I10, I11, I12, I13, I14, I15]}
  - {code: C, id: 301, name: 洲 C, parent: B, color: "#d4ac0d", labels: [C, D],
     # 洲 C、D 之间：南方缝合带（M5）-> 走滑断层谷（M30）-> 南裂谷海轴线（G8）
     poly: [[-50, -50], [-50, 40], [18.4, 36], [18.4, 30], [20.8, 23], [21, 15.5], [19.2, 8], [18.6, 3], [18.6, 0.5],
            [18.7, -3], [18.9, -6.5], [18.8, -9.5], [19.2, -14], [20.6, -21], [22.4, -28], [23, -35], [23, -50]]}
  - {code: D, id: 401, name: 洲 D, parent: C, color: "#7f8c8d", labels: [C, D]}
  - {code: FAR, id: 501, name: 远方大陆, parent: C, color: "#a04000", labels: [far], islands: [I20]}
  - {code: POL, id: 601, name: 极地大陆, parent: D, color: "#5d6d7e", labels: [polar], islands: [I22]}

# 关键帧：时间（Ma）-> 相对父板块的位置（操作序列）。0 Ma 为现今位置（不用写）。
# 拼合位置（贴合、少重叠）由搜索得出：在固定块的现今参照系里调移动距离、方位与自转，使海岸接触最多、重叠最少；
# 洲 D 相对洲 C 的欧拉极同时要求合上南裂谷海、缝合带两侧不张不压（见 docs/tectonics_method.md U23）。
keys:
  B:      # 绝对运动缓慢（欧亚式），300 Ma 时偏南约 1800 km
    150: [{move: [600, 180]}, {spin: 5}]
    300: [{move: [1800, 190]}, {spin: 15}]
  A:      # 250–220 Ma 与洲 B 碰撞焊合；此前在西南方的大洋对岸
    220: []
    250: [{move: [400, 245]}]
    300: [{move: [2600, 240]}, {spin: -20}]
  BSE:    # 约 280 Ma 从南方陆块群东北缘（当时极地大陆朝向洲 B 的一侧）裂离（基梅里式），横越古洋北上，
          # 约 200–120 Ma 陆续拼到洲 B 南缘。洲 D 北缘当时在西边约 1 万公里外，从那里来要 12 cm/yr 以上，不取
    120: []
    200: [{move: [700, 190]}]
    # U26 第二轮：265 Ma 向东绕开南方地盾陆块 400 km（原插值位姿 + 挪开）。原路线 280–200 Ma 擦过南方地盾陆块（约 259 Ma
    # 重叠 0.22 百万 km²），引擎把擦边变成碰撞，沿路刮掉东南增生地块西部约 0.4 百万 km²；绕行后沿路重叠积分 4.28 -> 1.06
    # 百万 km²·Myr，最快 4.2 cm/yr。剩下的是 280 Ma 出发位置与极地大陆的拼合残差（约 0.06），在 280 Ma 再挪也去不掉
    265: [{pole: [134.6525, -13.8026, 39.6496]}, {move: [400, 90]}]
    280: {frame: POL, ops: [{to: [139.5, -62.75]}, {move: [731, -10.8]}, {spin: 7.8}]}
  C:      # 南方诸陆块相对洲 B 北移，残留洋盆（主内海的前身）在两者之间收窄
    35:  [{move: [150, 195]}]
    60:  [{move: [500, 190]}]
    100: [{move: [1500, 185]}, {spin: 5}]
    150: [{move: [3000, 185]}, {spin: 8}]      # U24：早期自转由 15–25° 减到 10°（自转会把东侧的洲 D 及其邻块甩向洲 B）
    200: [{move: [4200, 190]}, {spin: 10}]
    250: [{move: [5000, 195]}, {spin: 10}]
    300: [{move: [5600, 200]}, {spin: 10}]
  D:      # 0–35 Ma 相对洲 C 绕西侧的极逆时针转约 4°（缝合带走滑约 280 km，南裂谷海张开）；180–150 Ma 与洲 C 碰撞
    35:  [{pole: [-19.8, 9.5, -4.0]}]
    150: [{pole: [-19.8, 9.5, -4.0]}]
    180: [{pole: [-19.8, 9.5, -4.0]}, {move: [350, 95]}]
    300: [{pole: [-19.8, 9.5, -4.0]}, {move: [2600, 105]}, {spin: 10}]
  MD:     # 约 120 Ma 从洲 D 东缘的内凹处裂离，漂开约 700 km 后停住（马达加斯加式）
    90:  []
    120: [{move: [733, 235.6]}, {spin: 31.1}]
  IN:     # 绝对参照系（热点参照系）：约 120 Ma 前贴在洲 D 东岸外、裂离微大陆北侧，补回的大印度式陆缘朝向外洋（U24 连同陆缘、
          # 把同时期的洲 B、极地大陆、南洋陆块、东南增生地块都当障碍重拼：U23 第一版只拼本体，陆缘会插进洲 D）；
          # 裂开后一路北移；约 75 Ma 西北部经过东洋热点
          # （溢流玄武岩）；约 48 Ma 前缘撞上洲 B，此后再汇聚约 2000 km（碰撞挤掉的陆缘，正向演化前补回）
    48:  {frame: B, ops: [{move: [2000, 180]}]}
    75:  [{point_to: [[76.0, 18.0], [63.0, -21.0]]}, {pole: [63.0, -21.0, -12]}]   # 绕热点顺时针转 12°：北上时补回的陆缘擦过洲 D 东北角少些
    120: {frame: D, ops: [{pole: [-127.007, -14.443, 70.157]}]}   # U24 重拼：贴在洲 D 东岸外、微大陆北侧，补回的陆缘朝外洋；西北角离 75 Ma 的热点约 970 km
  FAR:    # 约 150 Ma 与洲 C 裂开，向西漂走（西大洋张开）
    150: [{move: [4758, 82.1]}, {spin: -14.1}]
  POL:    # 约 140 Ma 从洲 D 南缘裂开，漂到极地
    140: [{to: [32, -58]}, {spin: 30}, {move: [889, -3.9]}, {spin: 3.9}]
  ZL:     # 约 85 Ma 从极地大陆裂离（大部分沉没的微大陆）
    85:  [{move: [2971, 174.0]}, {spin: 2.8}]

# 热点轨迹检验：热点在地幔里近似固定，板块上某点在某时刻应位于热点上方
hotspot_checks:
  - {plate: IN, point: [76.0, 18.0], t: 75, hotspot: [63.0, -21.0],
     note: 南方地盾半岛西北部的溢流玄武岩应在东洋热点上方（德干—留尼汪式）。终图写的是约 66 Ma，倒推时为把速度控制在 10 cm/yr 左右改为约 75 Ma}

# 事件时间表（出时间表图、写文档；倒推时据此定关键帧）
events:
  - {t: [300, 250], kind: drift, what: 洲 A 从西南方大洋对岸向洲 B 漂来}
  - {t: [250, 220], kind: collision, what: 洲 A、B 碰撞焊合，北方缝合老山（M4）}
  - {t: [280, 200], kind: drift, what: 东南增生地块从南方陆块群东北缘（极地大陆一侧）裂离、横越古洋北上（基梅里式）}
  - {t: [200, 120], kind: collision, what: 东南增生地块陆续拼到洲 B 南缘（东南增生半岛）}
  - {t: [180, 150], kind: collision, what: 洲 C、D 碰撞焊合，南方缝合带山系（M5）}
  - {t: [150, 0], kind: rift, what: 远方大陆与洲 C 裂开，西大洋张开}
  - {t: [140, 100], kind: rift, what: 极地大陆从洲 D 南缘裂开，漂到极地}
  - {t: [120, 90], kind: rift, what: 裂离微大陆与南方地盾陆块一起从洲 D 东缘裂开}
  - {t: [100, 0], kind: subduction, what: 残留洋盆（主内海）北缘俯冲转碰撞，内海北岸山系（M1）}
  - {t: [90, 48], kind: drift, what: 南方地盾陆块快速北移，约 75 Ma 经过东洋热点（溢流玄武岩）}
  - {t: [85, 0], kind: rift, what: 南洋陆块从极地大陆裂离}
  - {t: [60, 0], kind: collision, what: 洲 D 东北角撞上洲 B（东方地峡）；南岸挤压反转（M2）}
  - {t: [48, 0], kind: collision, what: 南方地盾陆块撞上洲 B，东方大高原隆起（仍在汇聚）}
  - {t: [35, 0], kind: rift, what: 洲 D 相对洲 C 斜向北移：南裂谷海张开，缝合带复活为走滑断层}
  - {t: [25, 0], kind: rift, what: 南方地盾裂谷（地幔柱）}

# ---------------------------------------------------------------------------------------------------------
# U24：300 Ma 初始世界（scripts/design_initial_world.py）
# 碰撞：下行块的陆缘在正向演化中被俯冲、拼贴进造山带，要预先补回。范围按运动学算（packages/tectonics/reverse.py
# consumed_margin）：上盘块从接触时刻到现今扫过、一路走在陆地上就碰到下行块的地方。中间隔着海的（残留洋盆）不算。
collisions:
  # U26 第二轮：南方地盾陆块的补回陆缘按体积平衡定。终图上这次碰撞垫出的东方大高原（PL1）、南缘与内部山系（M3、M3b、M3c、
  # M3e、M3f）、前陆褶皱带（M3d）、南方喀斯特高原（PL8）共 5.59 百万 km²，按 Airy 均衡换算需要超额地壳约 95×10⁶ km³
  # （scripts/design_initial_world.py 的 volume_balance，结果写在 initial_v2.json）。U24 只补离陆块 1000 km 以内的陆壳，
  # 约 56×10⁶ km³，而且 48 Ma 的接触点在更外侧、那段当作洋壳，大陆碰撞要到约 20 Ma 才开始，0 Ma 高原只有缝合带上一条窄带。
  # 补到运动学扫过的全部范围（2200 km，扣除碰撞前会压到别的块的部分）约 89×10⁶ km³，大陆碰撞从约 48 Ma 开始。
  # 补回陆缘大部分是 16–20 km 的超伸展陆缘、在海平面以下（大印度盆地式），厚度剖面不变。
  - {down: IN, up: B, t: 48, max_km: 2600, continental_km: 2200, what: 南方地盾陆块撞上洲 B（大印度式陆缘）,
     volume_balance: {builds: [PL1, PL8, M3, M3b, M3c, M3d, M3e, M3f]}}
  - {down: A, up: B, t: 250, max_km: 900, what: 洲 A、B 碰撞}
  - {down: D, up: C, t: 180, max_km: 900, what: 洲 C、D 碰撞}
  - {down: D, up: B, t: 60, max_km: 1600, what: 洲 D 东北角撞上洲 B（东方地峡）}

# U25：洋壳归属与俯冲方向（packages/tectonics/reverse.py assign_ocean_plates；scripts/design_forward.py 预设俯冲方向）。
# 第一次正向运行按"离哪块大陆近就归谁"分洋壳，板块边界在大洋正中，海沟与岛弧长在大洋中间、长成条带状陆地，
# 俯冲方向又按首次接触随机决定（洲 B 被当成下行板块被洲 A 吃掉）。改为按成因设计：
# - 汇聚的两块之间的洋壳归下行一方，海沟在上盘陆缘外 forearc_km（安第斯、苏门答腊的海沟离海岸 100–250 km）；
# - 其余洋壳归外大洋板块，固定在地幔（热点）参照系里：各大陆向前漂移时在前缘压到它之上（安第斯型陆缘），
#   后缘张开新洋壳（被动陆缘）。外大洋板块的运动没有倒推（大洋长链热点岛链要它相对热点运动，留到 1.2d）；
# - subduction 每条：down 是下行板块（碰撞时被消耗），over 是上盘；先写的优先。外大洋板块与任何大陆相遇都是它下行。
ocean:
  background: {id: 900, name: 外大洋板块}
  forearc_km: 120
  corridor_km: 6500
  between_cos: -0.5         # "在两块之间"：两块方向夹角大于 120°（90° 时洲 A 分到的洋壳伸到 A、B 南边很远，见 reverse.py）
  # U26：外大洋里单独运动的大洋板块（终图 M8"大洋板块向东俯冲到远方大陆之下（安第斯型）"、M7"东缘长期俯冲的活动陆缘"）。
  # 外大洋板块固定不动时，俯冲速度只有大陆自己的 2–3 cm/yr，安第斯型山系长不起来（U25：M8 708 m / 设计 5600）。
  # 两块在日界线附近相接、背向运动，中间是扩张脊（东太平洋海隆式）。范围：300 Ma 时外大洋里最近的大陆是 near、
  # 在它的 side 一侧、纬度在 lat 内（正对海岸，免得东大洋板块北段一路漂到洲 A、洲 C 去）。
  # 运动：绕固定欧拉极（地幔参照系）匀速转动，欧拉极取在 300 Ma 范围质心与"朝向海岸"方向所在大圆的极上，
  # 质心处速度 = speed。地球上纳斯卡板块约 7 cm/yr、太平洋板块 7–10 cm/yr；这里取 5 与 4 cm/yr（加上远方大陆
  # 150 Ma 以后约 2.5 cm/yr 的西漂，远方大陆西岸汇聚约 7.5 cm/yr）。欧拉极由 300 Ma 几何算出后写在这里。
  # U27：按终图东大洋热点链重定。终图的大洋长链、南方珊瑚岛群、南方孤岛链都越老越往西北（首段方位 288°–297°），
  # 所在板块向西北运动；U26 第一版的东大洋板块（向东）正好盖住这三条链，正向演化出的链朝东南（129°–130°），反了。
  # 改为以约 128°W 的扩张脊（300 Ma 时的位置；东太平洋海隆式）为界：东侧向东俯冲到远方大陆（纳斯卡式），
  # 西侧一直到洲 B 东岸、向西北运动并载着热点链（太平洋式）。西侧板块的欧拉极由三条链的首段方位拟合
  # （0–30 Ma 极 (120°E, 66°S)，三处方位 293°–295°，平均误差 4.4°，大洋长链热点处 6 cm/yr）；
  # 大洋长链在 (174°W, 26°N) 转向北（老段方位 331°–355°），活动端到弯点 1790 km，按 6 cm/yr 约 30 Ma 转弯：
  # 30–60 Ma 绕 (115.4°E, 9.4°S)，热点处向 350°（夏威夷—天皇海山链式）；60 Ma 以前沿用第一段。
  plates:
    # 东侧板块包住 300 Ma 时远方大陆西、西南、南侧所有最近的洋壳（第一版只取正西方向：南侧、西南侧是固定的外大洋，
    # 150 Ma 以前远方大陆随洲 C 向东走，身后张开的新洋壳都归了它，积成一大片围裙；150 Ma 后远方大陆西移，东侧板块被夹在
    # 海岸与围裙之间、0 Ma 前整块俯冲完，南方几条热点链落在远方大陆的围裙上、跟着它向西南走）
    - {id: 910, code: EO, name: 东大洋东侧板块, near: FAR, lat: [-60, 30], lon: [-128, -30],
       pole: [-46.99, 52.80], speed_cm_yr: 5.8,   # 与西侧板块的西向分量（约 5.5 cm/yr）相当，扩张脊大体不动
       what: 向东俯冲到远方大陆西岸之下（安第斯型，M8、M8c）；西缘是与西侧板块之间的扩张脊}
    - {id: 920, code: PA, name: 东大洋西侧板块, lat: [-50, 62], lon: [125, -128],
       motion: [{from: 0, to: 30, pole: [120.0, -66.0], rate_deg_myr: 0.558},
                {from: 30, to: 60, pole: [115.37, -9.42], rate_deg_myr: 0.540},
                {from: 60, to: 300, pole: [120.0, -66.0], rate_deg_myr: 0.558}],
       what: 向西北运动，载着大洋长链等热点链；向西俯冲到洲 B 东岸之下（M7 东岸山系；东岸岛弧属 U28）}
  subduction:               # 先写的优先：洲 A 撞洲 B 排在古洋之后，洲 A 只拿 A、B 之间那条缺口里的洋壳
    - {down: [BSE], over: [B], what: 东南增生地块北上拼到洲 B 南缘（280–120 Ma）}
    - {down: [IN], over: [B], what: 南方地盾陆块撞洲 B（约 48 Ma，东方大高原）}
    - {down: [D], over: [C], what: 洲 C、D 碰撞（180–150 Ma）}
    - {down: [IN], over: [D], what: 南方地盾陆块北上时擦过洲 D 东北角（约 51 Ma，刚体残差 0.18 百万 km²）：擦过的是南方地盾陆块一侧，
       洲 D 东北角的裂谷肩山地保留（U26：按首次接触决定时洲 D 被定为下行，东北角被一路刮掉 0.86 百万 km²）。
       南方地盾陆块北上要穿过洲 D 东北角与东南增生地块之间的走廊，走廊比它窄，刚体平移必然擦边（地球上印支半岛向东"逃逸"，
       刚体块做不到）；改来向（南偏东 10°）只把擦洲 D 换成擦东南增生地块，总量少约三成，没有采用。代价：西北角约 0.33 百万 km²}
    - {down: [IN], over: [BSE], what: 同上，与东南增生地块之间也让南方地盾陆块一侧被刮（结果可预期，不按首次接触决定）}
    - {down: [C, D, IN, MD, POL, ZL], over: [A, B],
       what: 古洋向北俯冲到洲 A、B 南缘之下，残留洋盆成为主内海（内海北岸山系 M1 的成因）；洲 D 东北角撞洲 B（东方地峡）}
    - {down: [A], over: [B], what: 洲 A 撞洲 B（250–220 Ma）}

