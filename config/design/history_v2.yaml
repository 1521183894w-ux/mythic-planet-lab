# U25：正向演化（scripts/design_forward.py）的引擎参数，覆盖 packages/tectonics/crust.py Params 的默认值
forward:
  aprons:                             # U26：上盘板块不留挡路的洋壳"围裙"（scripts/design_forward.py strip_aprons）。每次提交后，
    strip: true                       # 上盘离自己陆壳 forearc_km 以外、夹在它和下行陆块之间（夹角同 between_cos）、
    approach_km: 1500                 # 离下行陆块 approach_km 以内、且下行板块正朝上盘汇聚（> min_conv_cm_yr）的洋壳转给下行板块
    min_conv_cm_yr: 0.5
    ocean_plates: false               # U28 第二轮试过打开（外大洋板块、大洋板块朝陆块汇聚时也不留围裙）：几乎所有陆缘都变成俯冲带，
                                      # 陆缘一圈弧增厚、长满弧火山，弧火山 5400 座、陆壳体积 +8.9%（固定的外大洋板块与任何漂移的
                                      # 大陆都汇聚），撤回；改为弧火山只长在设计的俯冲带上（scripts/design_forward.py designed_pairs）
  ocean_plates_take_continent_gaps: true   # U28：东大洋由大洋板块主导（见 scripts/design_forward.py ocean_gap_prefer）
  # U33：只定俯冲方向（scripts/design_forward.py preset_polarity，优先于 arcs.subduction 与 ocean.subduction；不参与 300 Ma 的洋壳划分，
  # 也不算设计的岛弧系统）。没有预设方向的板块对，碰上时由当时的地壳状态临时决定，对初始条件的小改动很敏感：U33 第一次运行在洲 A 之前
  # 插了三块微陆块，省份随机数随之重抽，279 Ma 东南增生地块刚从极地大陆裂开时的一次擦碰方向翻了（U32 是东南增生地块下行），之后
  # 东南亚整个走上另一条路（东大岛微陆块 57 Ma 就撞上东南增生地块，U32 是 22 Ma；东南增生半岛与苏门答腊式长岛连成一片）
  polarity:
    - {down: [BSE], over: [POL], what: 东南增生地块裂离时的擦碰（按 U32 的结果固定）}
    - {down: [C], over: [A], hole_down: true, what: 洲 C 名下挡在西段地体前方的古洋（方向同 ocean.subduction；hole_down：汇聚边界上的小洞归下行一方）}
    - {down: [WT, ADR, ET], over: [A, B], aprons: true, hole_down: true,
       what: 主内海北岸微陆块前方的古洋向北俯冲到洲 A、B 之下，微陆块随后撞上来（aprons：洲 A、B 挡在前面的洋壳围裙转给微陆块，
       见 forward.aprons；hole_down：汇聚边界上的小洞归微陆块。两项是第九、十次运行为 6–9°E 的深水窄湾加的，窄湾没变，
       真正的原因是 I4 记在洲 A 名下，见 blocks 的 WT；两项与其他俯冲带的做法一致，保留）}
    - {down: [WT, ADR], over: [C, ET, D], what: 西段、亚得里亚式地体对洲 C、D 是下行一方：洲 C、D 的洋壳碰上它们只删除、不长弧
       （否则神怒湾上长弧、湾面抬到 +1 km）}
    - {down: [D], over: [ET], what: 主内海东部的洋壳向北俯冲到东段地体之下（希腊—爱琴式），多湾半岛在上盘}
  # U30：走滑拉分与裂谷陆缘（Engine.cont_gap_pairs）。两块陆块之间张开的空隙，按累计张开宽度（两侧原有陆壳之间的距离）填拉伸减薄
  # 的陆壳：不到 w1 厚 T_narrow（沉积物充填的拉分盆地、走滑谷，谷底在海平面附近；死海—约旦谷、苏伊士湾式），w1 到 w_max 线性减薄到
  # T_wide（拉伸陆缘），超过 w_max 才长洋壳（红海式：宽过约 250 km 的部分是海底扩张）。之前引擎里洲 C、D 之间 35 Ma 起张开的走滑
  # 缺口全是新洋壳（终图有而引擎没有 0.18 百万 km²，水深约 4 km），终图上南裂谷海北端（约 9.5°S）以北是陆上的走滑断层谷与死海式洼地
