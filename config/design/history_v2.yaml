     volume_balance: {builds: [PL1, PL8, M3, M3b, M3c, M3d, M3e, M3f], efficiency: 0.573}}   # U28：保留率按上一次正向运行实测（66.5 / 89.6 = 0.74）；
                                   # U32：陆架、陆表海不接受弧增厚后（碰撞前沿被并入上盘的大印度式减薄陆缘也不再被弧增厚），实测 0.61 × 89.4 / 95.1 = 0.573；
