    # 被并进洲 C 北缘的"岬角"，西口反而更窄，撤回。西口被掐断的真正原因见 engine_params.no_collision_when_opening
  volcano_params:                          # packages/tectonics/volcanism.py VolcanoParams
    arcs: true                             # U28：俯冲带上盘洋壳上的弧火山（岛弧火山岛）
    arc_min_T_km: 10.0                     # U28 第二轮：弧地壳增厚到 10 km（俯冲十几 Myr）就长火山。第一轮要求 20 km，用来挡掉沿陆缘一圈的
                                           # 弧火山，现在由 arc_min_cont_km 挡；地球上弧火山在俯冲起始后几 Myr 就出现，弧地壳是它们堆起来的
    arc_min_cont_km: 150.0                 # U28 第二轮：离上盘自己的陆壳 150 km 以外（第一轮 250 km 切掉了千岛式东北岛链中段，它离两端的
                                           # 陆地 230–350 km）；陆缘弧的火山带离海岸只有几十公里，仍被排除
  # U32：试过"陆壳上盘的弧增厚只用于设计的俯冲带"（Engine.arc_cont_pairs，按板块对）：设计的活动陆缘前方的洋壳有一部分属于固定的
  # 外大洋板块，一刀切把设计的山系也压低了（远方大陆西岸 4150 -> 3297 m、洲 B 东岸 2058 -> 1208、极地两条山脊 1.7–2 km -> 约 0.4 km，
  # 东方大高原范围中位 4524 -> 3249 m），而且同一板块对在别处的汇聚照样抬起陆架（45% 的自动陆架露出）。关掉，改为按厚度
  # （engine_params.arc_cont_min_T_km：海平面以下的减薄陆缘不接受弧增厚）
  arc_continental_designed_only: false
  arc_continental_extra_pairs: [[EO, FAR]]   # 东大洋东侧板块向东俯冲到远方大陆之下（安第斯型 M8、M8c；U26 的大洋板块，不在 subduction 列表里）
  engine_params:
    # U31：剥蚀改按起伏非线性（packages/tectonics/crust.py Params.erosion_law）。U30 以前超出 35 km 的厚度一律按 120 Myr 指数衰减，
    # 低矮的老山与高山一样快：终图上约 20 条山系（老造山带、板内山地）0 Ma 只剩设计高度的 1/5–1/3，大陆大片是 400 m 的平原。
    # 地球上低起伏的老山剥得很慢（阿巴拉契亚 25–30 m/Myr，Matmon 等 2003），古生代造山带两三亿年后仍有 1–2 km
    erosion_law: relief
    # U28 弧增厚标定：原来全部按俯冲相对速度（0.8 km/Myr @ 10 cm/yr），长期快速俯冲会顶到 65 km 上限
    # （大洋板块主导东大洋后洲 B 东岸、远方大陆南段都到 4945 m）。分成两项：岩浆增生按相对速度，
    # 构造缩短按上盘朝海沟前进的速度（远方大陆西漂约 2.5 cm/yr → 安第斯式高山；洲 B 几乎不动 → 只有岩浆增生的岛弧式山地）
    arc_rate_km_myr: 0.2
    arc_shortening_km_myr: 0.8
    arc_accrete_T_km: 17.0                 # U28 弧—陆碰撞：厚的洋内弧地壳被大陆撞上时拼贴、抬升（台湾、新几内亚式）。第二轮由 20 改 17：
                                           # 洋壳类地壳厚过约 17 km 就因浮力难以俯冲（Cloos 1993）；汇聚 3–5 cm/yr 的洋内弧 40–50 Myr 长到 17–22 km
    arc_ocean_flux_factor: 3.0             # U28 第二轮：同样的岩浆通量摊在 200 km 宽的洋内弧带上增厚快 3 倍（见 crust.py）
    gap_prefer_opening_only: true          # U28 第二轮：指定归属的新洋壳只在两块张开处；汇聚边界上的网格小洞归下行板块（见 engine.py commit）
    arc_ocean_T_max_km: 30.0          # 洋内弧增厚上限（成熟洋内弧 20–35 km，整体是水下脊）；第一次运行不限，长出 14 百万 km² 条带陆地
    arc_to_cont_T_km: 31.0            # U26：高于上限，弧前与洋内弧地壳一直按洋壳类型处理（水下脊），不再转成陆壳：转成陆壳后，
                                      # 设计中的下行陆块（洲 D、南方地盾陆块、洲 C 北端）先撞上上盘弧前的弧地壳，多被消耗 100–200 km；
                                      # 弧地壳还靠陆壳的侧向流动长成沿海岸一圈约 1 km 高的陆地。重力垮塌摊过来的厚地壳仍按 31 km 转成陆壳。
                                      # 岛弧上的火山岛、弧—陆碰撞抬起的大岛留给 1.2d
    flow_min_T_km: 32.5               # U33：同一门槛下的陆壳也不参与厚地壳的侧向流动（前陆海、陆架不被旁边的山垫高；神怒湾）
    no_collision_when_opening: true   # U34：pull_apart 里的板块对，两侧正在分开处的陆—陆重叠是网格对不齐，不当碰撞（packages/tectonics/crust.py
                                      # Params.no_collision_when_opening）。不设时张开只有每 Myr 几公里的边界上陆壳被一点点泵厚：洲 C 北缘在主内海
                                      # 西口的裂开陆架（西段地体 100–45 Ma 以 0.25–0.4 cm/yr 北漂离开）约 79 Ma 起被记成"西段地体下行、洲 C 上盘"
                                      # 的碰撞、抬成 1–1.5 km 的陆地岬角，内海西端只剩约 80 km 宽，A 层把西口切成单独的小海盆。打开后 A 层主内海达标；
                                      # 岬角小了一半还在（0.5–1.3 km）：洲 C 60–35 Ma 以约 1.4、35 Ma 以来以约 0.4 cm/yr 向北挤向洲 A，裂开陆架在海峡口碰上洲 A 的角，
                                      # 是设计的汇聚造成的真实对撞（直布罗陀—里夫式），西口因此比终图长约 350 km
    view_hole_max_cells: 4            # U33：出帧时，四周全是陆地（或所在整片水体不超过 8 个单元）的瞬时小洞（汇聚边界上网格对不齐、刚补成的新洋壳，≤ 4 个单元）按相邻
                                      # 陆壳显示，不进入演化（packages/tectonics/crust.py Params.view_hole_max_cells；之前 0 Ma 上留成二十多处
                                      # 1–9 像元、−2.5 ~ −3 km 的封闭水坑，评审 stage1_2026-10-25_3 第 1 条）
    arc_cont_min_T_km: 32.5           # U32：比 32.5 km 薄的陆壳（海平面以下的陆架、陆表海、被淹的海湾，约 −20 m 以下）不接受弧增厚
                                      # （岩浆弧长在离海沟一两百公里的大陆上，弧前陆架、弧后减薄地壳不因弧岩浆增厚）
    arc_compress_T_max_km: 38.0       # U28 第三轮：挤压型洋内弧。岩浆增生仍封顶 30 km，上盘朝海沟推进的构造缩短可增厚到 38 km
                                      # （只用于 arcs.subduction 里标了 compress 的俯冲带，scripts/design_forward.py）。地球上上盘后撤或不动的岛弧（马里亚纳、
                                      # 伊豆—小笠原）弧地壳约 20 km、整体在水下；吕宋地壳 20–46 km（Geoscience Letters 2025，接收函数
                                      # 与噪声自相关），阿留申中段 35–37 km（东段约 30 km，Fliedner & Klemperer 1999）。
                                      # 本设计里只有菲律宾海式板块西缘（马尼拉式）的上盘在推进，吕宋式的东南弧北岛靠它露出水面

# 300 Ma 以前就有的构造（终图里写明是"古老"的）。300 Ma 以后形成的山与高原不预先放，由正向演化产生。
# 厚度按 Airy 均衡决定高程（35 km 约 +400 m，每 km 约 150 m），所以克拉通只略厚（地球上克拉通低平）。
initial:
  t0: 300
  mesh_level: 7
  block_order: [B, A, BSE, C, D, FAR, POL, IN, MD, ZL, NG, ALB, WT, ADR, ET]   # 同一节点几块认领时的先后
  T_cont_km: 35.0
  craton_T_km: 36.0
  craton_lithology: [LT7, LT8, LT9]                     # 终图岩性区里的古陆核
  craton_min_block_Mkm2: 3.0                            # 没有画古陆核的大块，取内部离边缘最远处做一个古陆核
  # U31：古老造山带的初始厚度按造山年龄由正向演化的剥蚀规律算出（scripts/design_initial_world.py old_orogen_add_km）：
  # 约 400 Ma（加里东—阿卡迪亚式）造山结束时超高 4.5 km，剥蚀 100 Myr 到 300 Ma 时约 1.4 km（加厚约 9 km），0 Ma 约 0.5 km（高程约 0.9 km）。
  # U24–U30 统一加 4 km（约 +0.6 km），在 120 Myr 线性衰减下 0 Ma 只剩约 +50 m
  old_orogens: {ids: [M6, M13b, M16, M8b], formed_ma: 400, h0_m: 4500, half_width_km: 150}
  tablelands: {ids: [PL7], add_km: 7.0, ramp_km: 70}
  # U32：盆地下沉量按终图高程由 Airy 均衡反算（from_design；B1、B2 300 m 约 0.66 km，B3 120 m 约 1.85 km，B4 150 m 约 1.65 km），
  # 过渡宽度用终图的 ramp_km；补上 B4（远方大陆东部大盆地，U31 的 0 Ma 是 400 m）。U24–U31 统一下沉 0.8 km
  basins: {ids: [B1, B2, B3, B4], from_design: true, sub_km: 0.8, ramp_km: 300}
  # U32：陆壳按省份给厚度起伏（scripts/design_initial_world.py province_relief）。U31 的 0 Ma 上陆地高程 10、25、50 分位都正好是
  # 400 m（陆壳除造山带、克拉通、盆地外都是 35 km），评审第 1 条。地球（除冰盖）同分辨率的陆地高程 5/10/25/50/75/90 分位是
  # 31 / 62 / 158 / 373 / 812 / 1437 m。每个省份的高程偏移 ~ N(mean_m, sd_m)、截在 [min_m, max_m]，换成厚度；同一块内平滑
  # smooth_iter 次（约 150 km）；离块边缘 ramp_km 以内渐弱（海岸不动）；降低后不低于 T_floor_km（约 +100 m）
  province_relief: {mean_m: -40, sd_m: 380, min_m: -350, max_m: 1000, smooth_iter: 12, ramp_km: 150, T_floor_km: 32.8,
                    min_base_T_km: 34.9}
  margin_km: 250                                        # 块边缘 250 km 内往海岸减薄
  margin_min: 0.72                                      # 被挤掉的陆缘按被动陆缘减薄到 72%（大部分在海平面以下）
  coast_T_km: 33.0                                      # 块本体（现今陆地）只减薄到 33 km（Airy 均衡下约 +100 m 的滨海平原），
                                                        # 现今海岸留在海平面附近。U24 曾把本体边缘也减薄到 72%（25 km，
                                                        # 约 −1 km），U25 第一次运行时现今海岸带与窄小陆块整片沉到海下
  ext_continental_km: 1000                              # 被挤掉的陆缘只补离下行块 1000 km 以内的陆壳；更远处是陆缘外侧的
                                                        # 洋盆（大印度盆地式，van Hinsbergen 等 2012），按洋壳处理
  ext_T_near_km: 30.0                                   # 被挤掉的陆缘：贴着下行块处约 30 km，往外减薄到超伸展陆缘约 16 km
  ext_T_far_km: 16.0                                    # （大印度式陆缘大部分是减薄陆缘甚至洋盆，van Hinsbergen 等 2012；
  ext_taper_km: 500                                     #   全按 30 km 补回，碰撞后堆出的高原会比终图大一倍）
  province_sep_km: 700
  half_spreading_km_myr: 25
  seed: 1
  # U28 第三轮：陆架下的减薄陆壳（scripts/design_initial_world.py shelf_margins）。现今在海平面以下、属于某块的被动陆缘，
  # 按该块的陆缘补进初始世界（只补多边形里的海与新生地壳岛；300 Ma 以来会压到别的块上的格点不补）。厚度 = far + (near − far)·
  # exp(−到块本体的距离 / taper)，再按块边缘统一减薄（margin_km、margin_min）。
  # 东岸大岛（台湾式）要岛弧撞上陆缘：终图上它离华夏式海岸约 300 km，中间是海峡式陆架；第二轮引擎里华夏式陆缘只到海岸线，
  # 海峡下面是洋壳，岛弧要再走 300 多 km 才碰得到陆壳。地球上台湾海峡下面是大陆地壳，南海北部陆缘约 30 km 厚的陆壳一直延到
  # 台湾中部（Byrne 等 2011，《Arc-Continent Collision》），台湾造山带就是这段陆缘被吕宋弧撞上挤起来的（约 6.5 Ma 起）。
  # 补海峡与东岸大岛外侧要被撞掉的远端陆缘（到约 120.5°E）。
  margins:
    # 厚度按正向运行实测倒推：东南增生地块 280–120 Ma 北上拼到洲 B 的途中，这段陆缘是前进的活动陆缘，被弧增厚。
    # 第三轮第一次按 30 -> 22 km 补，0 Ma 有 32–36 km（35 km 以上被剥蚀削掉，看起来只增厚 5–8 km），整片露出海面；
    # 第二次按 24 -> 18 km 补，10 Ma 有 33–37 km（实际增厚 8–13 km），海峡仍是陆地，东岸大岛连着大陆（终图上是约 150 km 宽的海峡）。
    # 改为 18 -> 14 km（超伸展陆缘的量级），0 Ma 约 26–31 km、在海平面以下
    - {block: BSE, what: 台湾海峡式陆架与远端陆缘（东岸大岛的成因）, T_near_km: 18.0, T_far_km: 14.0, taper_km: 300,
       poly: [[114.6, 22.2], [116.0, 21.4], [118.0, 21.0], [120.4, 22.2], [120.7, 24.2], [119.8, 25.4], [118.8, 26.4],
              [117.4, 26.4], [116.0, 25.2], [115.0, 23.6]]}
    # U30：被淹没的陆地（陆表海、陆架海、被淹的前陆盆地与夭折裂谷）。之前引擎里这些都是终图挖掉的"海"，初始世界按大洋补了洋壳，
    # 0 Ma 是 5–7 km 深、两三亿年老的洋壳深坑；地球上陆表海、陆架海的底是大陆地壳（哈得孙湾、波罗的海、白海、波斯湾、东海水深
    # 几十到一两百米，罗斯海、威德尔海的大陆架约 500 m）。按终图的海湾范围（gulfs）补成陆壳，每格归最近的陆块，厚度按设计水深
    # 由 Airy 均衡反算（depth_m），不做陆缘减薄（edge_thinning: false）。两个"神怒"共振湾的设计水深：神怒湾约 90 m、涌潮湾约 70 m。
    # 不补的：被动陆缘的宽阔海湾与拐角（G16、G18、G24，底是洋壳）、年轻裂谷湾（G9）、弧后盆地与残留洋盆（G12、G15、G22）、南裂谷海（G8）
    # 第一次运行补了 14 个海湾：处在稳定地带的 6 个水深接近设计；挨着活动带的 8 个（中部长海 G2、白湾 G3、东湾 G6、神怒湾 G7、
    # 西峡湾海 G1、内海西南湾 G27、内海南湾 G20、两个冰架湾 G25、G26）被碰撞增厚、厚地壳垮塌外摊与弧增厚抬成 +200 到 +1400 m 的陆地，
    # 内海南湾与神怒湾的陆壳在 4–0 Ma 对撞、把主内海截断（A 层不过）。地球上前陆盆地、冰盖压沉盆地靠挠曲沉降与冰川均衡保持在海面下，
    # 引擎没有这两个过程；这 8 个暂不补（仍是洋壳深坑），等有了挠曲沉降再做
    - {gulfs: [G5, G17, G23], depth_m: -80, edge_thinning: false,
       what: 浅的陆表海与陆架海（几十到一百多米；涌潮湾设计约 70 m）}
    - {gulfs: [G4, G10, G19], depth_m: -150, edge_thinning: false,
       what: 较深的陆架海、冰盖压沉的克拉通盆地与被淹的夭折裂谷}
    # U32：神怒湾（G7，设计水深约 90 m）与东湾（G6，与东湾北岸褶皱山 M3d 成对的前陆海，波斯湾平均约 50 m）。U30 补过一次，被弧增厚
    # 与碰撞抬成陆地、对撞截断主内海，撤回；U32 起海平面以下的减薄陆壳不接受弧增厚（engine_params.arc_cont_min_T_km），再试。
    # 评审 stage1_2026-10-25_2 第 3 条：两湾仍是 4–5 km 深槽，神怒湾按 Merian 公式的固有周期约 4.4 h，共振不成立。
    # 与上面两条一样，水深是按终图设定的初始条件（user_override），0 Ma 等于设计值不算过程的验证（评审第 9 条）
    # U33：神怒湾整片归亚得里亚式地体（它的前陆海，亚得里亚海式）。按最近的块分时约三分之一分给了洲 B，洲 B 是碰撞上盘，
    # 湾面被增厚抬起（中位 +980 m，80% 露出）
    - {gulfs: [G7], depth_m: -90, edge_thinning: false, block: ADR, what: 神怒湾（两侧山系之间被淹没的前陆盆地）}
    - {gulfs: [G6], depth_m: -80, edge_thinning: false, what: 东湾（碰撞前陆盆地被海水淹没，波斯湾式）}
    # U32：老陆缘的陆架与陆坡（auto，scripts/design_initial_world.py shelf_margins）。300 Ma 以前就有的被动陆缘：现今海岸外
    # 160 km 的陆架（32.0 -> 31.4 km，水深约 50–150 m）与 80 km 的陆坡（-> 18 km，约 −3.7 km）。只占到对岸距离的 40%
    # （两岸陆架不相接，西海峡不被堵）；所属海岸离设计的活动陆缘要素 300 km 以内的不补（俯冲型山系与全部岛弧：活动陆缘的陆架窄、
    # 在弧前；按所属海岸判断，整片陆架—陆坡一起去掉）；
    # 残留洋盆、弧后盆地、裂谷海与 U30 查明会被碰撞抬起的海湾不补。300 Ma 以来裂开的共轭陆缘由正向演化填（forward.pull_apart）
    - {auto: true, shelf_km: 160, slope_km: 80, T_coast_km: 32.0, T_break_km: 31.4, T_foot_km: 18.0,
       gap_frac: 0.4, active_km: 300, active_arcs: true, active_points_file: config/design/shelf_active_v2.yaml,
       active: [M1, M1b, M1d, M2, M13, M7, M7b, M8, M8c, M23, M25, M27, M24, M28, M29],
       exclude_gulfs: [G1, G2, G3, G6, G7, G8, G9, G12, G15, G20, G22, G25, G26, G27, G28],
       what: 老被动陆缘的陆架与陆坡}
