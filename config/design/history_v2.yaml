# U25：正向演化（scripts/design_forward.py）的引擎参数，覆盖 packages/tectonics/crust.py Params 的默认值
forward:
  aprons:                             # U26：上盘板块不留挡路的洋壳"围裙"（scripts/design_forward.py strip_aprons）。每次提交后，
    strip: true                       # 上盘离自己陆壳 forearc_km 以外、夹在它和下行陆块之间（夹角同 between_cos）、
    approach_km: 1500                 # 离下行陆块 approach_km 以内、且下行板块正朝上盘汇聚（> min_conv_cm_yr）的洋壳转给下行板块
    min_conv_cm_yr: 0.5
  engine_params:
    arc_ocean_T_max_km: 30.0          # 洋内弧增厚上限（成熟洋内弧 20–35 km，整体是水下脊）；第一次运行不限，长出 14 百万 km² 条带陆地
    arc_to_cont_T_km: 31.0            # U26：高于上限，弧前与洋内弧地壳一直按洋壳类型处理（水下脊），不再转成陆壳：转成陆壳后，
                                      # 设计中的下行陆块（洲 D、南方地盾陆块、洲 C 北端）先撞上上盘弧前的弧地壳，多被消耗 100–200 km；
                                      # 弧地壳还靠陆壳的侧向流动长成沿海岸一圈约 1 km 高的陆地。重力垮塌摊过来的厚地壳仍按 31 km 转成陆壳。
                                      # 岛弧上的火山岛、弧—陆碰撞抬起的大岛留给 1.2d

# 300 Ma 以前就有的构造（终图里写明是"古老"的）。300 Ma 以后形成的山与高原不预先放，由正向演化产生。
# 厚度按 Airy 均衡决定高程（35 km 约 +400 m，每 km 约 150 m），所以克拉通只略厚（地球上克拉通低平）。
initial:
  t0: 300
  mesh_level: 7
  block_order: [B, A, BSE, C, D, FAR, POL, IN, MD, ZL]   # 同一节点几块认领时的先后
  T_cont_km: 35.0
  craton_T_km: 36.0
  craton_lithology: [LT7, LT8, LT9]                     # 终图岩性区里的古陆核
  craton_min_block_Mkm2: 3.0                            # 没有画古陆核的大块，取内部离边缘最远处做一个古陆核
  old_orogens: {ids: [M6, M13b, M16, M8b], add_km: 4.0, half_width_km: 150}
  tablelands: {ids: [PL7], add_km: 7.0, ramp_km: 70}
  basins: {ids: [B1, B2, B3], sub_km: 0.8, ramp_km: 300}
  margin_km: 250                                        # 块边缘 250 km 内往海岸减薄
  margin_min: 0.72                                      # 被挤掉的陆缘按被动陆缘减薄到 72%（大部分在海平面以下）
  coast_T_km: 33.0                                      # 块本体（现今陆地）只减薄到 33 km（Airy 均衡下约 +100 m 的滨海平原），
                                                        # 现今海岸留在海平面附近。U24 曾把本体边缘也减薄到 72%（25 km，
                                                        # 约 −1 km），U25 第一次运行时现今海岸带与窄小陆块整片沉到海下
  ext_continental_km: 1000                              # 被挤掉的陆缘只补离下行块 1000 km 以内的陆壳；更远处是陆缘外侧的
                                                        # 洋盆（大印度盆地式，van Hinsbergen 等 2012），按洋壳处理
  ext_T_near_km: 30.0                                   # 被挤掉的陆缘：贴着下行块处约 30 km，往外减薄到超伸展陆缘约 16 km
  ext_T_far_km: 16.0                                    # （大印度式陆缘大部分是减薄陆缘甚至洋盆，van Hinsbergen 等 2012；
  ext_taper_km: 500                                     #   全按 30 km 补回，碰撞后堆出的高原会比终图大一倍）
  province_sep_km: 700
  half_spreading_km_myr: 25
  seed: 1
