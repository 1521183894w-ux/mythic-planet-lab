  note: 超级火山破火山口；间歇泉；猛犸温泉钙华；黄石大峡谷与瀑布
- id: 39
  name: 恩戈罗恩戈罗保护区
  archetypes: [破火山口湖、超级火山, 草原与大迁徙, 化石产地与地层剖面]
  note: 巨型破火山口内的野生动物；奥杜威峡谷古人类化石
- id: 63
