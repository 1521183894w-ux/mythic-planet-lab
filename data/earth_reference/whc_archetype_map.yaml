# UNESCO 世界遗产（标准 vii / viii）→ 奇景原型 的归类（阶段 0.5b）
#
# - 遗产地清单：data/earth_reference/whc_vii_viii.csv（scripts/fetch_whc_sites.py 从 Wikidata 生成）
# - 原型名称必须与 docs/archetype_library.md 表格第一列完全一致（去掉加粗符号）；
#   scripts/archetype_coverage.py 会校验，并生成 docs/archetype_coverage.md 的统计部分。
# - archetypes 第一个为主原型（遗产地入选标准 vii/viii 时最主要的景观），其余为次要景观。
# - note 写判断依据，一句话。中文名为开发者翻译。
# - extra: true 表示不在 CSV 中、因数据出入而补充核对的遗产地。

- id: 1
  name: 加拉帕戈斯群岛
  archetypes: [热点岛链与海山, 孤岛生物演化与海鸟岛, 上升流富饶海域]
  note: 热点火山群岛；特有物种演化；赤道与寒流上升流
- id: 9
  name: 塞米恩山国家公园
  archetypes: [溢流玄武岩台地, 大断崖, 低纬雪峰与垂直自然带]
  note: 玄武岩高原被切成千米断崖与尖峰；非洲高山带
- id: 24
  name: 纳汉尼国家公园
  archetypes: [深切大峡谷, 巨型瀑布, 溶洞与地下河]
  note: 南纳汉尼河峡谷、弗吉尼亚瀑布、喀斯特与温泉
- id: 25
