# IUGS 地质遗产地 → 奇景原型 的归类（阶段 0.5c，原型库的第二份外部核对清单）
#
# - 遗产地清单：data/earth_reference/iugs_geoheritage_sites.csv（scripts/fetch_iugs_sites.py 从 IUGS 网站接口生成）
# - id 为 IUGS 网站的条目编号（CSV 的 wp_id 列，稳定）；显示顺序用 CSV 的 no 列（按发布日期排）。
# - archetypes：原型名称必须与 docs/archetype_library.md 表格第一列完全一致；第一个为主原型（该地最主要的景观或地质特征）。
# - minerals：矿床类遗产地对应 docs/mineral_resources.md 中的矿床类型（名称为表格第一列，去掉"0.5c 新增"标记）。
#   纯矿床的遗产地可以没有 archetypes，但 archetypes 与 minerals 至少要有一项。
# - note 写判断依据，一句话；中文名为开发者翻译。开发者对个别遗产地细节没有把握的，注明"未核实"。
# - "已在 UNESCO 名单"指该地已作为世界遗产（或其一部分）列入，开发者凭记忆标注，未逐一核实。
# - scripts/archetype_coverage.py 会校验，并生成 docs/archetype_coverage.md 的 IUGS 统计部分。

# ---- 第一批（2022） ----------------------------------------------------------------------
- id: 2183
