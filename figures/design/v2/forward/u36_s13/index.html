<meta charset="utf-8"><title>U36-S13 曲边与中心求积</title><style>body{font:16px sans-serif;max-width:1500px;margin:30px auto}img{width:100%}</style><h1>U36-S13：同一材料的曲边与中心求积</h1><p>限定方法检查点；按误差选取四个单元，未接全球/B5，阶段1未通过。</p><p><a href="../../../../stage1/u36_s13_reference/index.html">冻结世界的29张标准图</a></p><h2>同一材料的曲边与三顶点直边</h2><img src="121_material_curved_edges.png"><p>按旧误差选取四个诊断单元，不代表全部来源；局部心射图保等比例；右列以米显示曲边法向偏离。</p><h2>直边误差与中心取样分开</h2><img src="122_error_decomposition.png"><p>总差等于两项之和是算术分解；没有逐来源归一化，不作为质量或物理守恒证明。</p><h2>曲边几何与内部J积分的采样敏感性</h2><img src="123_independent_area_sampling.png"><p>最高两档也只是有限近似；跨片内部积分可不单调，两曲线不是等成本精度排名。</p><h2>直边跨片与实际材料采样点的分片历史</h2><img src="124_material_face_history.png"><p>分片是运动插值分区，不是断层；只检查141个离散时点和有限样本，非连续域证明。</p>
