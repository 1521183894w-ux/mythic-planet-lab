<meta charset="utf-8"><title>U36-S7 参照系审计</title><style>body{font:16px sans-serif;max-width:1500px;margin:30px auto}img{width:100%}</style><h1>U36-S7：同一物理运动的参照系审计</h1><h2>共同刚体与精确参照</h2><img src="96_rigid_frame_objectivity.png"><p>NN=自然邻域；BC=重心。锚定板块改变仅改变坐标，不能改变还原后的真实材料运动；零误差刚体特例不证明一般变形正确。</p><h2>相同物理运动的参照系差</h2><img src="97_deforming_frame_differences.png"><p>每组对照共享旋转文件、原始材料点和网络；不同输入史不能相互排名。数值差异不当作物理剪切/真实减薄。</p><h2>步长与标量审计</h2><img src="98_frame_step_and_scalar.png"><p>只记录框架数值客观性；真实物理带宽/古接触仍待独立约束。未采用任何参照系或插值方案为全球替换。</p>
