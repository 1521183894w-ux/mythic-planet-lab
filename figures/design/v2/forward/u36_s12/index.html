<meta charset="utf-8"><title>U36-S12 分片求积</title><style>body{font:16px sans-serif;max-width:1500px;margin:30px auto}img{width:100%}</style><h1>U36-S12：同一分片运动场的材料求积诊断</h1><p>方法检查点；未接全球/B5，阶段1未通过。</p><h2>同一来源域的初始分区对照</h2><img src="117_initial_partition.png"><p>只改求积分区，不改运动场。初始跨片1308→0；有限精度微片及逐UID初始库存差另列。</p><h2>六案独立有限面积—中心厚度对照</h2><img src="118_quadrature_comparison.png"><p>相同L号的单元数量不同，不能称同样成本的精度排名；三档不证明收敛阶。</p><h2>原15个来源逐项核对</h2><img src="119_nonmonotonic_sources.png"><p>完整77来源和两个分区的非单调清单均在JSON保留；不能仅挑改善来源。</p><h2>演化过程中跨片关联</h2><img src="120_crossing_association.png"><p>跨片指运动插值分区，不是地质断层；初始对齐不等于后续持续对齐，未每步重切或强制守恒。</p>
