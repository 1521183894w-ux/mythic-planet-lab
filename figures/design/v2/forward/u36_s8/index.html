<meta charset="utf-8"><title>U36-S8 固定域连续性</title><style>body{font:16px sans-serif;max-width:1500px;margin:30px auto}img{width:100%}</style><h1>U36-S8：固定源域与材料连续性</h1><h2>固定源域与保留外圈</h2><img src="99_fixed_source_domain.png"><p>2km是审计保护余量，不是物理变形带宽、断层宽度或新地壳；所有面积/体积回球面计算，不以投影面积冒充km²。</p><h2>固定域柱连续性与空间细分</h2><img src="100_fixed_domain_continuity.png"><p>H=H0/Jac_center，体积使用独立有限三角形面积；仍是给定运动下的柱连续性假设。不是流变、真实侧向流动或完整三维物质解。</p><h2>固定域材料厚度</h2><img src="101_fixed_material_thickness.png"><p>灰色为原非陆壳/无覆盖，不补陆壳。域外原材料保留库存；图为条件性整柱厚度，不是地表高程、水深、B5或新海岸。</p>
